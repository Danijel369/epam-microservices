services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    # Base images are amd64-only Temurin Alpine; run emulated on Apple Silicon.
    platform: linux/amd64
    ports:
      - "8761:8761"
    # Busybox wget (Alpine) probes the Eureka dashboard; clients wait for this.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  resource-db:
    image: postgres:17-alpine
    container_name: resource-db
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "5432:5432"
    # Read-only mount of the schema script; run once by the postgres entrypoint
    # on first startup. No data volume => data is not persisted between restarts.
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    # S3 emulator for resource-service. Multi-arch image, so it runs natively on
    # Apple Silicon (no platform override needed, unlike the Temurin JVM services).
    ports:
      - "4566:4566"
    environment:
      # Start only the S3 provider (faster, lighter); it is all we use.
      SERVICES: s3
    # No data volume: like the databases, state resets on `down`. The app
    # re-creates its bucket on startup, so the emulator always starts empty.
    healthcheck:
      # Pass only once S3 itself reports ready, not merely when the edge port answers.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  song-db:
    image: postgres:17-alpine
    container_name: song-db
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  song-service:
    build: ./song-service
    # No container_name: it would collide when scaling to multiple replicas.
    # Base images are amd64-only Temurin Alpine; run emulated on Apple Silicon.
    platform: linux/amd64
    # Two fixed-port replicas (TASK-M3 Option 2): replica 1 -> host 8082,
    # replica 2 -> host 8083, both on container port 8082. Postman keeps using
    # 8082, and each replica also stays reachable directly.
    deploy:
      replicas: 2
    ports:
      - "8082-8083:8082"
    environment:
      SPRING_DATASOURCE_URL: ${SONG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      # Register the container IP so the two replicas are distinct, reachable instances.
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
    depends_on:
      song-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  resource-service:
    build: ./resource-service
    container_name: resource-service
    platform: linux/amd64
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${RESOURCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      # S3 object storage (LocalStack). Consumed by the S3 client added in ST-2.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
    # song-service is discovered dynamically through Eureka, so it is not a
    # startup dependency here; only the DB, the registry and S3 storage are.
    depends_on:
      resource-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      localstack:
        condition: service_healthy
