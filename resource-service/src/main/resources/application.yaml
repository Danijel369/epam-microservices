server:
  port: 8081

spring:
  application:
    name: resource-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# Base URL of the Song Service used by the load-balanced RestClient.
# The default is the LOGICAL service id (not a host:port): a @LoadBalanced
# RestClient resolves "song-service" through Eureka and picks an instance,
# so the same value works locally and in Docker. Overridable via env var.
song-service:
  base-url: ${SONG_SERVICE_URL:http://song-service}

# S3 object storage (LocalStack emulator). Local defaults target a LocalStack
# running on the host; compose overrides the endpoint with the service name.
# The emulator accepts any credentials, so the defaults are dummy values.
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:4566}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:resource-files}
  access-key: ${S3_ACCESS_KEY:test}
  secret-key: ${S3_SECRET_KEY:test}
  path-style: ${S3_PATH_STYLE:true}

# Eureka client. defaultZone points at the registry; the tip intervals below
# speed up registration/discovery for local development and the demo.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # How often this client refreshes its local copy of the registry (default 30s).
    registry-fetch-interval-seconds: 5
  instance:
    # Local default: register as "localhost" (prefer-ip-address false), which is
    # reachable via loopback on ANY network — even a hotspot/VPN where the host's own
    # LAN IP isn't reachable from itself. In Docker, compose sets
    # EUREKA_PREFER_IP_ADDRESS=true so each container registers its own compose-network
    # IP instead, giving distinct, directly reachable instances when song-service scales.
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # How often this instance sends heartbeats to the server (default 30s).
    lease-renewal-interval-in-seconds: 5
